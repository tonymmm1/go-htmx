name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and test
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install npm dependencies
        run: npm ci --no-audit --no-fund

      - name: Verify Go modules
        run: go mod verify

      - name: Check formatting
        run: make fmt-check

      - name: Lint (go vet, staticcheck)
        run: make lint

      - name: Test with race detector
        run: make test-race

      - name: Test project generators
        run: make test-generators

      - name: Build application
        run: make build

      - name: Audit dependencies (npm audit, govulncheck)
        run: make audit

  docker:
    name: Build container
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build production image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          load: true
          tags: go-htmx:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test container
        run: |
          docker run -d --name app -p 8080:8080 go-htmx:ci
          for i in $(seq 1 20); do
            curl -fsS -o /dev/null http://127.0.0.1:8080/healthz && break
            sleep 0.5
          done
          curl -fsS -o /dev/null http://127.0.0.1:8080/
          # The stylesheet must be embedded in the binary.
          css="$(curl -fsS http://127.0.0.1:8080/ | grep -o '/static/css/styles.css?v=[0-9a-f]*')"
          curl -fsS -o /dev/null "http://127.0.0.1:8080$css"
          docker exec app /app/server -healthcheck
          docker rm -f app
